
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoConsent - Live Location Share</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f0f4ff}
.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
button{background:#2c5cff;color:white;border:none;padding:15px 25px;border-radius:10px;font-size:18px;width:100%;margin-top:15px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:10px}
#map{width:100%;height:300px;margin-top:15px;border-radius:10px;display:none}
</style>
</head>
<body>
<div class="card">
<h2>📍 GeoConsent</h2>
<p>Link er maddome location share koro</p>
<button onclick="shareLocation()">Amar Location Share Koro</button>
<input id="linkBox" readonly placeholder="Link ekhane asbe...">
<button onclick="copyLink()" style="background:#00b26e">Link Copy Koro</button>
<iframe id="map"></iframe>
<p id="status"></p>
</div>
<script>
let shareLink="";
function shareLocation(){
 if(!navigator.geolocation){alert("Location support kore na");return;}
 document.getElementById("status").innerText="Location niteche...";
 navigator.geolocation.getCurrentPosition(pos=>{
  let lat=pos.coords.latitude;
  let lng=pos.coords.longitude;
  shareLink=`https://junaedtaskin-dot.github.io/?lat=${lat}&lng=${lng}`;
  document.getElementById("linkBox").value=shareLink;
  document.getElementById("map").style.display="block";
  document.getElementById("map").src=`https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
  document.getElementById("status").innerText="Link ready! Ekhon copy kore friend ke pathao.";
 },()=>{alert("Location allow koro");});
}
function copyLink(){
 let box=document.getElementById("linkBox");
 box.select();
 document.execCommand("copy");
 alert("Link Copy Hoise! Ekhon WhatsApp e share koro.");
}
window.onload=function(){
 let p=new URLSearchParams(window.location.search);
 let lat=p.get("lat"), lng=p.get("lng");
 if(lat && lng){
  document.getElementById("map").style.display="block";
  document.getElementById("map").src=`https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
  document.getElementById("status").innerText=`Friend er location: ${lat}, ${lng}`;
 }
}
</script>
</body>
</html>
